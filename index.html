<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LAWASTOTO - Live RTP & Bukti JP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <!-- HEADER & SLIDER BANNER -->
    <header class="container pt-3">
        <div id="mainSlide" class="splide mb-3 rounded-3 overflow-hidden">
            <div class="splide__track">
                <ul class="splide__list">
                    <li class="splide__slide"><img src="https://img.viva88athenae.com/events/pp-ramadhan-26.jpg" alt="Banner 1"></li>
                    <li class="splide__slide"><img src="httpshttps://img.viva88athenae.com/events/pp-candy-rush-june-26.jpg" alt="Banner 2"></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- PAGE 1: HOME (RTP & JACKPOT LIST) -->
    <main id="page-home" class="page-content container pb-5 mb-5">
        <!-- Live Jackpot Terkini -->
        <h5 class="fw-bold text-white mb-3">🔥 LIVE WINNER JACKPOT</h5>
        <div id="render-jackpots" class="mb-4"></div>

        <!-- Slider Provider -->
        <h5 class="fw-bold text-white mb-3">🎮 PROVIDER PILIHAN</h5>
        <div id="providerSlide" class="splide mb-4">
            <div class="splide__track">
                <ul class="splide__list" id="render-providers"></ul>
            </div>
        </div>

        <!-- List Grid Slot RTP -->
        <h5 class="fw-bold text-white mb-3">🎰 REKOMENDASI SLOT GACOR HARI INI</h5>
        <div class="row g-2" id="render-slots"></div>
    </main>

    <!-- PAGE 2: BUKTI JP GALLERY (LIVE FIREBASE) -->
    <main id="page-buktijp" class="page-content container pb-5 mb-5 d-none">
        <h4 class="fw-bold text-white mb-1">📢 LIVE FEED BUKTI JP MEMBER</h4>
        <p class="text-white-50 small mb-4">Bukti transfer kemenangan real-time lunas dibayar tanpa tunda.</p>
        <div class="row g-3" id="render-bukti-gallery"></div>
    </main>

    <!-- NAVIGATION BAWAH (MOBILE APP STYLE) -->
    <nav class="bottom-nav">
        <div class="bottom-nav-item active" id="nav-home" onclick="switchPage('home')">
            <span>🏠</span><div class="nav-text">Home</div>
        </div>
        <div class="bottom-nav-item" id="nav-buktijp" onclick="switchPage('buktijp')">
            <span>💰</span><div class="nav-text">Bukti JP</div>
        </div>
    </nav>

    <!-- CORE SCRIPTS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    
    <!-- Firebase Terintegrasi (V8 Standar) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
