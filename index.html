<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAWASTOTO - Bocoran RTP Terbaru & Pola Slot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#121212] text-white">

    <!-- HEADER -->
    <header class="bg-[#1a1a1a] p-4 flex justify-between items-center border-b border-gray-800 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-black tracking-wider neon-text">LAWASTOTO</span>
        </div>
        <div class="flex space-x-2">
            <a href="https://l1nq.com/f8pahdo" class="bg-gray-700 text-white px-4 py-1.5 rounded-md font-bold text-sm">Main</a>
            <a href="https://l1nq.com/f8pahdo" class="neon-bg text-black px-4 py-1.5 rounded-md font-bold text-sm">Daftar</a>
        </div>
    </header>

   <!-- 1. BANNER SLIDESHOW ULTRA-WIDE (PERSIS image_5ec99d.jpg) -->
    <section class="px-4 pt-4 relative group">
        <!-- Rasio diatur aspect-[3.8/1] atau aspect-[4/1] biar super ramping -->
        <div id="banner-slider" class="w-full aspect-[3.8/1] rounded-2xl relative overflow-hidden border border-gray-800/40 bg-[#161616]">
            
            <!-- Slide Gambar -->
            <img src="https://img.viva88athenae.com/events/mega-gacor-l3-2026.jpg" class="slide absolute inset-0 w-full h-full object-cover opacity-100 transition-all duration-700 ease-in-out">
            <img src="https://img.viva88athenae.com/events/pp-candy-rush-june-26.jpg" class="slide absolute inset-0 w-full h-full object-cover opacity-0 transition-all duration-700 ease-in-out">
            <img src="https://img.viva88athenae.com/events/pp-ramadhan-26.jpg" class="slide absolute inset-0 w-full h-full object-cover opacity-0 transition-all duration-700 ease-in-out">
            
            <!-- Tombol Navigasi Kiri / Kanan -->
            <button onclick="changeSlide(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white/70 hover:text-white w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold z-20 transition">❮</button>
            <button onclick="changeSlide(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white/70 hover:text-white w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold z-20 transition">❯</button>
            
            <!-- Indikator Titik Kecil di Bawah Tengah -->
            <div id="slide-dots" class="absolute bottom-2 left-1/2 -translate-x-1/2 flex space-x-1.5 z-20">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>
        </div>
    </section>

    <!-- 2. PROVIDER SLIDER DENGAN LOGO GAMBAR & BISA DIKLIK -->
    <section class="py-3 relative bg-[#161616] mt-4 border-y border-gray-800/60 overflow-hidden">
        <div class="flex w-full overflow-hidden relative">
            <!-- Supaya mulus jalan otomatis tapi tetep bisa diklik filternya -->
            <div id="provider-track" class="flex space-x-3 animate-scroll whitespace-nowrap py-1 px-4 items-center">
                <!-- Diisi otomatis via JavaScript -->
            </div>
        </div>
    </section>

    <!-- 3. 10 JACKPOT TERAKHIR LIVE (ADAPTOR WAKTU & JAM) -->
    <section class="p-4 bg-[#161616] mx-4 my-4 rounded-xl border border-gray-800">
        <div class="flex items-center space-x-2 mb-4">
            <span class="text-blue-400 text-lg">👑</span>
            <h2 class="text-xs font-bold uppercase tracking-wider">10 Jackpot Terakhir Live</h2>
        </div>
        <div id="jackpot-container" class="space-y-2">
            <!-- Data di-load melalui script.js -->
        </div>
    </section>

    <!-- 4. GAME GRID & RTP (FIX GAMBAR KEPOTONG / ASPECT SQUARE) -->
    <section class="p-4 grid grid-cols-2 gap-4 mb-24" id="game-container">
        <!-- Data di-load melalui script.js -->
    </section>

    <!-- FOOTER NAVIGATION BAR -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#161616]/95 border-t border-gray-800 p-2 flex justify-around text-center z-50 backdrop-blur-sm">
        <div class="text-blue-400 text-xs flex flex-col items-center cursor-pointer"><span>🏠</span><span class="text-[9px] font-bold mt-1">HOME</span></div>
        <div class="text-gray-500 text-xs flex flex-col items-center cursor-pointer"><span>🎟️</span><span class="text-[9px] font-bold mt-1">BUKTI JP</span></div>
        <div class="text-gray-500 text-xs flex flex-col items-center cursor-pointer"><span>🏆</span><span class="text-[9px] font-bold mt-1">EVENT</span></div>
        <div class="text-gray-500 text-xs flex flex-col items-center cursor-pointer"><span>▶️</span><span class="text-[9px] font-bold mt-1">MAIN</span></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
