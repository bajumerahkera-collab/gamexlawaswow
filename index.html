<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAWASTOTO - Bocoran RTP Terbaru & Pola Slot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Tambahan Swiper CSS untuk slideshow banner & provider jika dibutuhkan, namun kita pakai native Tailwind slider yang smooth -->
</head>
<body class="bg-[#121212] text-white">

    <!-- HEADER -->
    <header class="bg-[#1a1a1a] p-4 flex justify-between items-center border-b border-gray-800 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-black tracking-wider neon-text">LAWASTOTO</span>
        </div>
        <div class="flex space-x-2">
            <a href="#" class="bg-gray-700 text-white px-4 py-1.5 rounded-md font-bold text-sm">Main</a>
            <a href="#" class="neon-bg text-black px-4 py-1.5 rounded-md font-bold text-sm">Daftar</a>
        </div>
    </header>

   <!-- 1. BANNER SLIDESHOW DENGAN FOTO -->
    <section class="p-4 relative overflow-hidden">
        <div id="banner-slider" class="w-full aspect-[21/9] md:aspect-[3/1] rounded-xl relative overflow-hidden border border-blue-500/30 bg-[#161616]">
            <!-- Slide 1 -->
            <img src="https://img.viva88athenae.com/events/pp-ramadhan-26.jpg" class="slide absolute inset-0 w-full h-full object-cover opacity-100 transition-opacity duration-1000">
            
            <!-- Slide 2 -->
            <img src="https://img.viva88athenae.com/events/pp-candy-rush-june-26.jpg" class="slide absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-1000">
            
            <!-- Slide 3 (Tambahkan kalau ada banner ketiga) -->
            <img src="https://img.viva88athenae.com/events/mega-gacor-l3-2026.jpg" class="slide absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-1000">
        </div>
    </section>

    <!-- 2. PROVIDER SLIDER (BISA DI-SLIDE) -->
    <section class="p-4 relative">
        <h2 class="text-xs font-bold tracking-wider mb-3 text-gray-400">OFFICIAL PROVIDERS</h2>
        <div class="relative w-full flex items-center">
            <!-- Container Slide -->
            <div id="provider-container" class="flex space-x-3 overflow-x-auto pb-2 scroll-smooth scrollbar-hide w-full">
                <div class="min-w-[120px] bg-[#1e1e1e] p-3 rounded-xl border-2 neon-border text-center font-bold text-xs text-blue-400">PRAGMATIC PLAY</div>
                <div class="min-w-[120px] bg-[#1e1e1e] p-3 rounded-xl border border-gray-800 text-center font-bold text-xs text-gray-500">PG SOFT</div>
                <div class="min-w-[120px] bg-[#1e1e1e] p-3 rounded-xl border border-gray-800 text-center font-bold text-xs text-gray-500">HABANERO</div>
                <div class="min-w-[120px] bg-[#1e1e1e] p-3 rounded-xl border border-gray-800 text-center font-bold text-xs text-gray-500">JOKER GAMING</div>
                <div class="min-w-[120px] bg-[#1e1e1e] p-3 rounded-xl border border-gray-800 text-center font-bold text-xs text-gray-500">MICROGAMING</div>
                <div class="min-w-[120px] bg-[#1e1e1e] p-3 rounded-xl border border-gray-800 text-center font-bold text-xs text-gray-500">SPADEGAMING</div>
            </div>
        </div>
    </section>

    <!-- 3. 10 JACKPOT TERAKHIR LIVE + GAMBAR GAME -->
    <section class="p-4 bg-[#161616] mx-4 rounded-xl border border-gray-800">
        <div class="flex items-center space-x-2 mb-4">
            <span class="text-blue-400 text-lg">👑</span>
            <h2 class="text-xs font-bold uppercase tracking-wider">10 Jackpot Terakhir Live</h2>
        </div>
        <div id="jackpot-container" class="space-y-2 max-h-[350px] overflow-y-auto pr-1">
            <!-- Data di-load melalui script.js lengkap dengan foto mini game -->
        </div>
    </section>

    <!-- Search & Filter Bar -->
    <section class="p-4 flex gap-2">
        <input type="text" placeholder="Cari game..." class="w-full bg-[#1e1e1e] border border-gray-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500 text-white">
        <button class="bg-[#1e1e1e] border border-blue-500/30 text-blue-400 px-4 py-2 rounded-lg text-xs font-bold">Cari</button>
    </section>

    <!-- 4. GAME GRID & RTP (FIX GAMBAR TERPOTONG & CENTER RTP) -->
    <section class="p-4 grid grid-cols-2 gap-4 mb-24" id="game-container">
        <!-- Data di-load melalui script.js -->
    </section>

    <!-- FOOTER NAVIGATION BAR -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#161616]/95 border-t border-gray-800 p-2 flex justify-around text-center z-50 backdrop-blur-sm">
        <div class="text-blue-400 text-xs flex flex-col items-center cursor-pointer"><span>🏠</span><span class="text-[9px] font-bold mt-1">HOME</span></div>
        <div class="text-gray-500 text-xs flex flex-col items-center cursor-pointer"><span>🎟️</span><span class="text-[9px] font-bold mt-1">BUKTI JP</span></div>
        <div class="text-gray-500 text-xs flex flex-col items-center cursor-pointer"><span>🏆</span><span class="text-[9px] font-bold mt-1">EVENT</span></div>
        <div class="text-gray-500 text-xs flex flex-col items-center cursor-pointer"><span>▶️</span><span class="text-[9px] font-bold mt-1">MAIN</span></div>
    </div>

    <!-- Panggil File Script -->
    <script src="script.js"></script>
</body>
</html>
