<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LAWASTOTO - Live RTP & Bukti JP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <header class="container pt-3">
        <div id="mainSlide" class="splide mb-3 rounded-3 overflow-hidden">
            <div class="splide__track">
                <ul class="splide__list">
                    <li class="splide__slide"><img src="https://img.viva88athenae.com/events/pp-ramadhan-26.jpg" alt="Banner 1"></li>
                    <li class="splide__slide"><img src="https://img.viva88athenae.com/events/pp-candy-rush-june-26.jpg" alt="Banner 2"></li>
                </ul>
            </div>
        </div>
    </header>

    <main id="page-home" class="page-content container pb-5 mb-5">
        <h5 class="fw-bold text-white mb-3">🔥 LIVE WINNER JACKPOT</h5>
        <div id="render-jackpots" class="mb-4"></div>

        <h5 class="fw-bold text-white mb-3">🎮 PROVIDER PILIHAN</h5>
        <div id="providerSlide" class="splide mb-4">
            <div class="splide__track">
                <ul class="splide__list" id="render-providers"></ul>
            </div>
        </div>

        <h5 class="fw-bold text-white mb-3">🎰 REKOMENDASI SLOT GACOR HARI INI</h5>
        <div class="row g-2" id="render-slots"></div>
    </main>

    <main id="page-buktijp" class="page-content container pb-5 mb-5 d-none">
        <h4 class="fw-bold text-white mb-1">📢 LIVE FEED BUKTI JP MEMBER</h4>
        <p class="text-white-50 small mb-4">Bukti transfer kemenangan real-time lunas dibayar tanpa tunda.</p>
        <div class="row g-3" id="render-bukti-gallery"></div>
    </main>

    <nav class="bottom-nav">
        <div class="bottom-nav-item active" id="nav-home" onclick="switchPage('home')">
            <span>🏠</span><div class="nav-text">Home</div>
        </div>
        <div class="bottom-nav-item" id="nav-buktijp" onclick="switchPage('buktijp')">
            <span>💰</span><div class="nav-text">Bukti JP</div>
        </div>
    </nav>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="script.js"></script>

    <script>
        (function() {
            // ⚠️ GANTI DENGAN GRUP KONFIGURASI FIREBASE MILIKMU SENDIRI
            const configIsolasiJP = {
                apiKey: "AIzaSyCEbmZLDH6mQ-baQM4b58z_89bhBy3ggb8",
                authDomain: "gamelawaswow.firebaseapp.com",
                databaseURL: "https://gamelawaswow-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "gamelawaswow",
                storageBucket: "gamelawaswow.firebasestorage.app",
                messagingSenderId: "1027106854763",
                appId: "1:1027106854763:web:6b59883c73733da4c6de2e"
            };

            // Proteksi inisialisasi agar tidak bentrok dengan instance firebase lain
            let appJP;
            if (!firebase.apps.length) {
                appJP = firebase.initializeApp(configIsolasiJP);
            } else {
                appJP = firebase.apps[0];
            }

            const dbJP = appJP.database();
            const wadahGallery = document.getElementById('render-bukti-gallery');

            if (wadahGallery) {
                wadahGallery.innerHTML = '<p class="text-center text-white-50 py-5">⏳ Menghubungkan ke server bukti JP...</p>';

                // Tarik data secara realtime dari node 'bukti_jp'
                dbJP.ref('bukti_jp').on('value', (snapshot) => {
                    wadahGallery.innerHTML = "";

                    if (snapshot.exists()) {
                        const kumpulanData = snapshot.val();
                        
                        // Loop data & urutkan dari yang terbaru (reverse)
                        Object.keys(kumpulanData).reverse().forEach((key) => {
                            const item = kumpulanData[key];
                            const kartuHTML = `
                                <div class="col-12 col-md-6 col-lg-4">
                                    <div class="card h-100 shadow-sm" style="background: #111827; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden;">
                                        <div class="card-body p-3">
                                            <h6 class="text-white fw-bold mb-1" style="font-size: 0.95rem; line-height: 1.4;">${item.title}</h6>
                                            <small class="text-white-50 d-block mb-2" style="font-size: 0.75rem;">📅 lunas: ${item.date}</small>
                                        </div>
                                        <div style="background: #0f172a; padding: 12px; text-align: center; display: flex; justify-content: center; align-items: center;">
                                            <img src="${item.img}" class="img-fluid rounded" alt="Bukti Kemenangan" style="max-height: 260px; object-fit: contain;">
                                        </div>
                                    </div>
                                </div>
                            `;
                            wadahGallery.innerHTML += kartuHTML;
                        });
                    } else {
                        wadahGallery.innerHTML = '<p class="text-center text-white-50 py-5">Belum ada postingan bukti kemenangan baru.</p>';
                    }
                }, (error) => {
                    console.error("Firebase Error: ", error);
                    wadahGallery.innerHTML = '<p class="text-center text-danger py-5">❌ Gagal memuat data live feed.</p>';
                });
            }
        })();
    </script>
</body>
</html>
