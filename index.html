<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAWASTOTO - Bocoran RTP Terbaru & Pola Slot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#121212] text-white">

    <!-- HEADER -->
    <header class="bg-[#1a1a1a] p-4 flex justify-between items-center border-b border-gray-800 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-black tracking-wider neon-text">LAWASTOTO</span>
        </div>
        <div class="flex space-x-2">
            <a href="https://lawasajak.com/" class="bg-gray-700 text-white px-4 py-1.5 rounded-md font-bold text-sm">Main</a>
            <a href="https://lawasajak.com/" class="neon-bg text-black px-4 py-1.5 rounded-md font-bold text-sm">Daftar</a>
        </div>
    </header>

    <!-- 1. BANNER SLIDESHOW PROPOSIONAL (FIX KEBESARAN) -->
    <section class="p-4 relative">
        <div id="banner-slider" class="w-full aspect-[2.4/1] rounded-xl relative overflow-hidden border border-blue-500/20 bg-[#161616]">
            <img src="https://img.viva88athenae.com/events/pp-candy-rush-june-26.jpg" class="slide absolute inset-0 w-full h-full object-cover opacity-100 transition-opacity duration-1000">
            <img src="https://img.viva88athenae.com/events/mega-gacor-l3-2026.jpg" class="slide absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-1000">
            <img src="https://img.viva88athenae.com/events/pp-ramadhan-26.jpg" class="slide absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-1000">
        </div>
    </section>

    <!-- 2. PROVIDER SLIDER AUTOMATIC INFINITE SCROLL -->
    <section class="py-2 relative overflow-hidden bg-[#161616] border-y border-gray-800/60">
        <div class="flex w-full overflow-hidden relative">
            <!-- Gerakan slide otomatis diatur via CSS / JS cloning -->
            <div id="provider-track" class="flex space-x-4 animate-scroll whitespace-nowrap py-2 px-4">
                <!-- Diisi otomatis via JavaScript -->
            </div>
        </div>
    </section>

    <!-- 3. 10 JACKPOT TERAKHIR LIVE (ADAPTOR WAKTU & JAM) -->
    <section class="p-4 bg-[#161616] mx-4 my-4 rounded-xl border border-gray-800">
        <div class="flex items-center space-x-2 mb-4">
            <span class="text-blue-400 text-lg">👑</span>
            <h2 class="text-xs font-bold uppercase tracking-wider">10 Jackpot Terakhir Live</h2>
        </div>
        <div id="jackpot-container" class="space-y-2">
            <!-- Data di-load melalui script.js -->
        </div>
    </section>

    <!-- 4. GAME GRID & RTP (FIX GAMBAR KEPOTONG / ASPECT SQUARE) -->
    <section class="p-4 grid grid-cols-2 gap-4 mb-24" id="game-container">
        <!-- Data di-load melalui script.js -->
    </section>

    <!-- FOOTER NAVIGATION BAR -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#161616]/95 border-t border-gray-800 p-2 flex justify-around text-center z-50 backdrop-blur-sm">
        <div class="text-blue-400 text-xs flex flex-col items-center cursor-pointer"><span>🏠</span><span class="text-[9px] font-bold mt-1">HOME</span></div>
        <div class="text-gray-500 text-xs flex flex-col items-center cursor-pointer"><span>🎟️</span><span class="text-[9px] font-bold mt-1">BUKTI JP</span></div>
        <div class="text-gray-500 text-xs flex flex-col items-center cursor-pointer"><span>🏆</span><span class="text-[9px] font-bold mt-1">EVENT</span></div>
        <div class="text-gray-500 text-xs flex flex-col items-center cursor-pointer"><span>▶️</span><span class="text-[9px] font-bold mt-1">MAIN</span></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
