<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bukti Kemenangan / JP Member - LAWASTOTO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #cbd5e1; padding: 30px 10px; }
        .jp-card { background: #111827; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .jp-title { color: #fff; font-weight: 600; font-size: 1.1rem; }
        .jp-date { color: #00f0ff; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="container" style="max-width: 800px;">
        <h2 class="text-center text-white fw-bold mb-4">🏆 BUKTI KEMENANGAN MEMBER LAWASTOTO 🏆</h2>
        <hr class="border-secondary mb-4">
        
        <div id="feedBuktiJp" class="row">
            <div class="text-center text-white-50 col-12">⏳ Memuat bukti kemenangan terbaru...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // SAmakan Konfigurasi Firebase ini dengan yang ada di script Admin
        const firebaseConfig = {
            apiKey: "PASTE_API_KEY_FIREBASE_KAMU_DISINI",
            authDomain: "proyek-kamu.firebaseapp.com",
            databaseURL: "https://proyek-kamu-default-rtdb.firebaseio.com",
            projectId: "proyek-kamu",
            storageBucket: "proyek-kamu.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:12345:web:12345"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Mengambil data dari node 'bukti_jp'
        const feedContainer = document.getElementById('feedBuktiJp');

        database.ref('bukti_jp').on('value', (snapshot) => {
            feedContainer.innerHTML = ""; // Bersihkan loading
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // Balik urutan data agar yang terbaru muncul di paling atas
                const keys = Object.keys(data).reverse(); 

                keys.forEach((key) => {
                    const item = data[key];
                    
                    // Struktur HTML untuk tiap list card bukti JP
                    const cardHtml = `
                        <div class="col-md-6">
                            <div class="jp-card shadow-sm">
                                <img src="${item.img}" class="img-fluid w-100" alt="Bukti JP" style="max-height: 300px; object-fit: cover;">
                                <div class="p-3">
                                    <div class="jp-title mb-1">${item.title}</div>
                                    <div class="jp-date">📅 Tanggal: ${item.date}</div>
                                </div>
                            </div>
                        </div>
                    `;
                    feedContainer.innerHTML += cardHtml;
                });
            } else {
                feedContainer.innerHTML = `<div class="text-center text-white-50 col-12">Belum ada bukti kemenangan yang diterbitkan.</div>`;
            }
        }, (error) => {
            console.error(error);
            feedContainer.innerHTML = `<div class="text-center text-danger col-12">Gagal memuat data. Periksa pengaturan Firebase Rules Anda.</div>`;
        });
    </script>
</body>
</html>
